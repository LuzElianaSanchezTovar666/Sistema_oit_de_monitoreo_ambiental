# ==============================================================================
# SIMOA · Configuración de Producción Eclipse Mosquitto (RNF-09)
# ==============================================================================

# RNF-09: Cero conexiones anónimas permitidas
allow_anonymous false

# RNF-09: Listener seguro MQTTS en puerto 8883
listener 8883 0.0.0.0
protocol mqtt

# RNF-09: Cifrado TLS 1.3 estricto
tls_version tlsv1.3
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
require_certificate false

# RNF-09: Archivos de credenciales y ACL de mínimo privilegio
acl_file mosquitto/config/acl.conf
password_file mosquitto/config/passwords

# Rendimiento y resiliencia (RNF-03 y RNF-11)
persistence true
persistence_location /var/lib/mosquitto/
max_inflight_messages 100
max_queued_messages 10000
log_dest stdout
log_type error
log_type warning
log_type notice
