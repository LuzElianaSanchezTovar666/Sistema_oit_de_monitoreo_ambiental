# ==============================================================================
# SIMOA · Reglas de Control de Acceso (ACL) Eclipse Mosquitto (RNF-09)
# ==============================================================================

# Usuario backend SIMOA: consume telemetría y heartbeats de todos los nodos
user simoa-backend-ingest
topic read simoa/dispositivos/+/telemetria
topic read simoa/dispositivos/+/heartbeat
topic write simoa/dispositivos/+/comandos

# Usuario Node-RED para mediación y flujos de prueba autorizados
user nodered-gateway
topic readwrite simoa/dispositivos/+/telemetria

# Dispositivos IoT (ESP32): Cada nodo solo puede publicar en su propio tópico autorizado
# Regla de negocio: Cada ESP32 publica exclusivamente en su tópico y NO puede suscribirse a otros nodos
pattern write simoa/dispositivos/%u/telemetria
pattern write simoa/dispositivos/%u/heartbeat
pattern read simoa/dispositivos/%u/comandos
