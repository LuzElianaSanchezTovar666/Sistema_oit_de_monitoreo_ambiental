# SIMOA · Broker Mosquitto (RF-06) para desarrollo local
# En producción: habilitar allow_anonymous false + password_file + TLS (listener 8883).
listener 1883 127.0.0.1
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
max_inflight_messages 100
max_queued_messages 5000
