services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-simoa}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_HOST: "%"
      # Compatibilidad con DB_PASSWORD vacío en desarrollo local.
      MYSQL_ALLOW_EMPTY_PASSWORD: "1"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u root -N -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
