<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SIMOA · Sistema Inteligente de Monitoreo Ambiental</title>
    <meta name="description" content="Sistema Inteligente de Monitoreo Ambiental (SIMOA) con telemetría IoT en tiempo real, detección inteligente de anomalías con IA, gestión de nodos ESP32 y alertas MQTT." />
    <meta name="theme-color" content="#1B5E20" />
    <link rel="icon" type="image/png" href="/assets/images/simoa-icon.png" />
    <meta property="og:title" content="SIMOA · Sistema Inteligente de Monitoreo Ambiental" />
    <meta property="og:description" content="Sistema Inteligente de Monitoreo Ambiental con telemetría en tiempo real, detección de anomalías térmicas e higrométricas, gestión de nodos ESP32 y alertas." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Auto-unregister stale service workers on localhost so old cached dark HTML never blocks rendering -->
    <script>
      if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      }
    </script>

    <!-- Preload critical LCP Hero image in AVIF format -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero-iot-stage.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <!-- Self-hosted / System Font Stack limited strictly to weights 400 and 600 with font-display: swap -->
    <style>
      @font-face {
        font-family: 'SF Pro Display Local';
        src: local('SF Pro Display'), local('Inter'), local('Segoe UI'), local('Roboto');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'SF Pro Text Local';
        src: local('SF Pro Text'), local('Inter'), local('Segoe UI'), local('Roboto');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'SF Pro Text Local';
        src: local('SF Pro Text Semibold'), local('Inter SemiBold'), local('Segoe UI Semibold'), local('Roboto Medium');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      body {
        margin: 0;
        background-color: #F2F8F4;
        color: #0D3B1E;
        font-family: 'SF Pro Text Local', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .ssr-shell {
        min-height: 100vh;
        background: linear-gradient(180deg, #F2F8F4 0%, #E7F3EB 100%);
        color: #0D3B1E;
        display: flex;
        flex-direction: column;
      }
      .ssr-nav {
        height: 56px;
        background: #FFFFFF;
        border-bottom: 1px solid #C8E6C9;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        font-size: 13px;
        font-weight: 600;
        color: #1B5E20;
      }
      .ssr-hero {
        max-width: 1280px;
        margin: 0 auto;
        padding: 56px 24px;
      }
      .ssr-badge {
        display: inline-block;
        background: #E8F5E9;
        border: 1px solid #A5D6A7;
        color: #1B5E20;
        padding: 5px 10px;
        border-radius: 980px;
        font-size: 12px;
        font-weight: 600;
      }
      .ssr-title {
        font-size: clamp(38px, 6vw, 72px);
        font-weight: 600;
        line-height: 1.06;
        letter-spacing: -1.2px;
        color: #0D3B1E;
        margin: 18px 0;
      }
    </style>
  </head>
  <body>
    <!-- Pre-rendered Build/SSR App Shell for instant First Contentful Paint (FCP) -->
    <div id="root">
      <div class="ssr-shell" aria-busy="true">
        <div class="ssr-nav">
          <img src="/assets/images/simoa-logo.webp" alt="SIMOA" style="height: 32px; width: auto;" />
          <span>Sistema Inteligente de Monitoreo Ambiental</span>
        </div>
        <div class="ssr-hero">
          <span class="ssr-badge">SIMOA · MONITOREO AMBIENTAL IOT</span>
          <h1 class="ssr-title">Monitoreo ambiental inteligente.</h1>
          <p style="color:#3B694C;font-size:17px;">Cargando telemetría ambiental en tiempo real...</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Load third-party telemetry marker strictly AFTER page load -->
    <script defer>
      window.addEventListener('load', function () {
        var runPostLoadTasks = window.requestIdleCallback || function (cb) { setTimeout(cb, 250); };
        runPostLoadTasks(function () {
          window.__SIMOA_THIRD_PARTY_LOADED__ = true;
          if (
            'serviceWorker' in navigator &&
            location.protocol.indexOf('http') === 0 &&
            location.hostname !== 'localhost' &&
            location.hostname !== '127.0.0.1'
          ) {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          }
        });
      });
    </script>
  </body>
</html>
