<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SIMOA · Sistema Inteligente de Monitoreo Ambiental</title>
    <meta name="description" content="Sistema Inteligente de Monitoreo Ambiental (SIMOA) con telemetría IoT en tiempo real, detección inteligente de anomalías con IA, gestión de nodos ESP32 y alertas MQTT." />
    <meta name="theme-color" content="#104336" />
    <link rel="icon" type="image/png" href="/assets/images/simoa-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="SIMOA · Sistema Inteligente de Monitoreo Ambiental" />
    <meta property="og:description" content="Sistema Inteligente de Monitoreo Ambiental con telemetría en tiempo real, detección de anomalías térmicas e higrométricas, gestión de nodos ESP32 y alertas." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Auto-unregister stale service workers on localhost so old cached dark HTML never blocks rendering -->
    <script>
      if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      }
    </script>

    <!-- Preload critical LCP Hero image in AVIF format -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero-iot-stage.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <!-- Arcadia Observatory SSR App Shell -->
    <style>
      body {
        margin: 0;
        background-color: #f3f1ec;
        color: #101f1e;
        font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: "ss01" on;
      }
      .ssr-shell {
        min-height: 100vh;
        background: linear-gradient(212.12deg, #afc4bf 14.83%, #e8e7f5 52.99%, #f1eee9 79.47%);
        color: #101f1e;
        display: flex;
        flex-direction: column;
      }
      .ssr-announcement {
        background: #104336;
        color: #ffffff;
        padding: 10px 24px;
        text-align: center;
        font-size: 13px;
        font-weight: 400;
      }
      .ssr-nav {
        height: 68px;
        background: #ffffff;
        border-bottom: 1px solid #afc4bf;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        font-size: 14px;
        font-weight: 500;
        color: #104336;
      }
      .ssr-hero {
        max-width: 1200px;
        margin: 0 auto;
        padding: 88px 24px;
        text-align: center;
      }
      .ssr-badge {
        display: inline-block;
        color: #104336;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .ssr-title {
        font-size: clamp(40px, 5.5vw, 56px);
        font-weight: 300;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: #000000;
        margin: 12px 0 20px;
      }
    </style>
  </head>
  <body>
    <!-- Pre-rendered Build/SSR App Shell for instant First Contentful Paint (FCP) -->
    <div id="root">
      <div class="ssr-shell" aria-busy="true">
        <div class="ssr-announcement">
          SIMOA · Observatorio Ambiental IoT con telemetría MQTT en tiempo real
        </div>
        <div class="ssr-nav">
          <img src="/assets/images/simoa-logo.webp" alt="SIMOA" style="height: 32px; width: auto;" />
          <span>SIMOA · Sistema Inteligente de Monitoreo Ambiental</span>
        </div>
        <div class="ssr-hero">
          <span class="ssr-badge">SIMOA · MONITOREO AMBIENTAL IOT</span>
          <h1 class="ssr-title">Monitoreo ambiental inteligente.</h1>
          <p style="color:#535e5d;font-size:18px;font-weight:400;">Cargando telemetría ambiental en tiempo real...</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Load third-party telemetry marker strictly AFTER page load -->
    <script defer>
      window.addEventListener('load', function () {
        var runPostLoadTasks = window.requestIdleCallback || function (cb) { setTimeout(cb, 250); };
        runPostLoadTasks(function () {
          window.__SIMOA_THIRD_PARTY_LOADED__ = true;
          if (
            'serviceWorker' in navigator &&
            location.protocol.indexOf('http') === 0 &&
            location.hostname !== 'localhost' &&
            location.hostname !== '127.0.0.1'
          ) {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          }
        });
      });
    </script>
  </body>
</html>
